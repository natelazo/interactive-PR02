<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <link href="styles.css" type="text/css" rel="stylesheet" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halfday Iced Tea</title>
</head>

<body>
  <header>
    <a href="index.html">
      <img src="images/halfday-logo.jpg" alt="Halfday logo">
    </a>

    <nav>
      <a href="shop.html">Shop</a>
      <a href="story.html">Our Story</a>
      <a href="find-halfday.html" class="find-button">Find Halfday</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1 id="hero-heading">
        <span class="headline-one">The Better Half</span>
        <span class="headline-two">Of Your Day</span>
      </h1>

      <div class="cans">
        <img
          class="can-tropical"
          src="images/tropical.png"
          alt="Halfday Tropical Tea Can">

        <img
          class="can-raspberry"
          src="images/raspberry.png"
          alt="Halfday Raspberry Tea Can">
      </div>

      <ul class="benefits">
        <li>
          <img class="star" src="images/star.png" alt="">
          Prebiotics
        </li>

        <li>
          <img class="star" src="images/star.png" alt="">
          3-5g Sugar
        </li>

        <li>
          <img class="star" src="images/star.png" alt="">
          Low Calorie
        </li>
      </ul>

      <p>
        Gut-friendly nostalgic iced teas that make moments
        of freedom even sweeter.
      </p>

      <div class="hero-buttons">
        <button class="explore-button" type="button">Explore Flavors</button>
        <button class="sample-button" type="button">Get a Free Sample</button>
      </div>
    </section>
  </main>

  <!-- POP-UP BACKGROUND (will let me dim the background) -->
  <div id="overlay"></div>

  <!-- MODAL POP-UP -->
  <div class="modal" id="discount-modal">
    <button class="close-button" type="button"></button>
    <div class="modal-content">
      <img src="images/halfday-logo-pink.jpg" alt="Halfday logo">

      <h2>Get 15% Off</h2>

      <p>
        Sign up to be the first to know about discounts,
        exclusive perks, and other cool Halfday updates!
      </p>

      <button class="discount-button" type="button">Get Your Discount</button>
    </div>

    <div class="modal-image">
      <img
        src="images/discount-photo.jpg"
        alt="Pouring Halfday">
    </div>
</body>
</html>
